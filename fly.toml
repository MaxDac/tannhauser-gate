app = "tannhauser-gate"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate"
  strategy = "rolling"

  [deploy.release_command_vm]
    size = "shared-cpu-1x"
    memory = "256mb"

[env]
  PHX_HOST = "tannhauser-gate.fly.dev"
  PHX_SERVER = "true"
  PORT = "8080"
  ECTO_IPV6 = "true"
  POOL_SIZE = "2"
  UPLOADS_DIR = "/data/uploads"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "2s"

[[mounts]]
  source = "uploads"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
