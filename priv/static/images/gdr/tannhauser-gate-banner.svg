<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Tannhauser Gate: a Warden on a rain-soaked rooftop watching a glowing gate over a neon city">
  <defs>
    <linearGradient id="tg-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030504"/>
      <stop offset="60%" stop-color="#0b120e"/>
      <stop offset="100%" stop-color="#14231a"/>
    </linearGradient>
    <radialGradient id="tg-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9bf5bf" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#4ae08a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4ae08a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tg-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tg-street" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1712"/>
      <stop offset="100%" stop-color="#040705"/>
    </linearGradient>
    <linearGradient id="tg-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9bf5bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9bf5bf" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#9bf5bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="tg-rain" width="36" height="70" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <line x1="6" y1="0" x2="6" y2="22" stroke="#cad9cf" stroke-opacity="0.16" stroke-width="1"/>
      <line x1="24" y1="34" x2="24" y2="50" stroke="#cad9cf" stroke-opacity="0.1" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="url(#tg-sky)"/>

  <!-- The Gate: a vast ring of light hanging over Neo-Meridian. -->
  <circle cx="760" cy="130" r="210" fill="url(#tg-halo)"/>
  <circle cx="760" cy="130" r="96" fill="none" stroke="#4ae08a" stroke-opacity="0.85" stroke-width="5"/>
  <circle cx="760" cy="130" r="110" fill="none" stroke="#86e0b0" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="4 10"/>
  <circle cx="760" cy="130" r="80" fill="none" stroke="#9bf5bf" stroke-opacity="0.25" stroke-width="1"/>
  <ellipse cx="760" cy="130" rx="96" ry="18" fill="none" stroke="#9bf5bf" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="380" y="124" width="760" height="12" fill="url(#tg-beam)"/>

  <!-- Far skyline. -->
  <g fill="#0f1a13">
    <path d="M0 260 V200 H40 V170 H70 V210 H110 V150 H150 V220 H190 V180 H230 V240 H260 V130 H300 V230 H340 V190 H380 V260 Z"/>
    <path d="M380 260 V210 H420 V160 H450 V200 H500 V140 H540 V215 H600 V185 H640 V230 H700 V205 H740 V240 H800 V175 H840 V220 H900 V150 H950 V225 H1000 V190 H1040 V160 H1080 V210 H1130 V180 H1200 V260 Z"/>
  </g>

  <!-- Near towers, with lit windows. -->
  <g fill="#070c09">
    <path d="M0 330 V230 H60 V250 H95 V215 H150 V330 Z"/>
    <path d="M150 330 V250 H215 V330 Z"/>
    <path d="M540 330 V235 H600 V200 H650 V330 Z"/>
    <path d="M650 330 V255 H720 V330 Z"/>
    <path d="M880 330 V225 H930 V190 H985 V330 Z"/>
    <path d="M985 330 V240 H1060 V215 H1120 V330 Z"/>
    <path d="M1120 330 V260 H1200 V330 Z"/>
  </g>
  <g fill="#4ae08a" fill-opacity="0.7">
    <rect x="18" y="250" width="5" height="7"/>
    <rect x="34" y="270" width="5" height="7"/>
    <rect x="110" y="235" width="5" height="7"/>
    <rect x="126" y="262" width="5" height="7"/>
    <rect x="570" y="250" width="5" height="7"/>
    <rect x="615" y="220" width="5" height="7"/>
    <rect x="630" y="268" width="5" height="7"/>
    <rect x="905" y="245" width="5" height="7"/>
    <rect x="950" y="210" width="5" height="7"/>
    <rect x="1010" y="260" width="5" height="7"/>
    <rect x="1080" y="232" width="5" height="7"/>
  </g>
  <g fill="#ffb347" fill-opacity="0.7">
    <rect x="175" y="270" width="5" height="7"/>
    <rect x="690" y="275" width="5" height="7"/>
    <rect x="1150" y="280" width="5" height="7"/>
  </g>

  <!-- Vertical neon signs. -->
  <rect x="664" y="262" width="10" height="56" rx="3" fill="#4ae08a" fill-opacity="0.85"/>
  <rect x="1000" y="250" width="8" height="48" rx="3" fill="#86e0b0" fill-opacity="0.7"/>
  <rect x="196" y="262" width="8" height="40" rx="3" fill="#ffb347" fill-opacity="0.7"/>

  <!-- The rooftop and the Warden, long coat in the wind, watching the Gate. -->
  <path d="M260 330 V292 H520 V330 Z" fill="#050806"/>
  <rect x="262" y="286" width="256" height="6" fill="#0b120e"/>
  <g fill="#020302">
    <circle cx="440" cy="206" r="10"/>
    <path d="M430 218 L452 218 L458 252 L470 290 L452 286 L446 260 L440 286 L414 290 L424 252 Z"/>
    <path d="M425 202 H456 L452 196 H429 Z"/>
  </g>
  <circle cx="300" cy="270" r="26" fill="url(#tg-lamp)"/>
  <rect x="298" y="268" width="4" height="22" fill="#020302"/>

  <!-- An Echo in the alley below: only its eyes give it away. -->
  <g fill="#9bf5bf">
    <circle cx="806" cy="300" r="2"/>
    <circle cx="815" cy="300" r="2"/>
  </g>
  <circle cx="810" cy="300" r="16" fill="url(#tg-halo)"/>

  <!-- Wet street with neon reflections. -->
  <rect y="330" width="1200" height="70" fill="url(#tg-street)"/>
  <g fill-opacity="0.35">
    <rect x="664" y="334" width="10" height="44" fill="#4ae08a"/>
    <rect x="1000" y="334" width="8" height="36" fill="#86e0b0"/>
    <rect x="196" y="334" width="8" height="30" fill="#ffb347"/>
    <rect x="740" y="334" width="40" height="3" fill="#9bf5bf"/>
  </g>

  <rect width="1200" height="400" fill="url(#tg-rain)"/>

  <g font-family="'Courier New', Consolas, monospace" fill="#cad9cf">
    <text x="220" y="365" font-size="34" font-weight="bold" letter-spacing="8" fill="#4ae08a">TANNHAUSER GATE</text>
    <text x="222" y="388" font-size="14" letter-spacing="4" fill-opacity="0.65">NEO-MERIDIAN · 2121 · ECHOES IN THE RAIN</text>
  </g>
</svg>
